user  www-data;
worker_processes  auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=120r/m;
    limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;
    limit_req_status 429;

    server {
        listen 80;
        server_name _;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

        # -------- HEALTH --------
        location = /health {
            # Fix: Plaintext statt application/octet-stream
            default_type text/plain;
            charset utf-8;

            return 200 "ok\n";
        }

        # -------- API -> FastAPI (uvicorn @ 127.0.0.1:8000) --------
location /api/ {
    limit_req zone=api_per_ip burst=40 nodelay;
    limit_conn connections_per_ip 8;
    proxy_pass         http://127.0.0.1:8000/;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # >>> WICHTIG für Mobile:
    # 1) Content-Type nicht dem "default_type application/octet-stream" überlassen
    #    sondern immer explizit sichtbar machen
    proxy_hide_header Content-Type;
    add_header        Content-Type "application/json; charset=utf-8" always;

    # 2) Keine Chunked-Fragmente/Buffering, einige Mobile Stacks/Tunnel mögen das nicht
    proxy_buffering          off;
    proxy_request_buffering  off;
    sendfile                 off;

    # 3) Timeouts großzügiger (langsames Mobilnetz)
    proxy_connect_timeout    10s;
    # Route searches intentionally perform multiple rate-limited upstream calls.
    # The backend returns one response after the complete route is processed,
    # so 60 seconds could terminate an otherwise healthy request mid-run.
    proxy_read_timeout       300s;
    proxy_send_timeout       300s;
}
        # -------- PROXY -> FastAPI backend --------
        location /proxy {
            limit_req zone=api_per_ip burst=40 nodelay;
            limit_conn connections_per_ip 8;

            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_buffering          off;
            proxy_request_buffering  off;
        }

        # -------- ORS API proxy --------
        location /ors/ {
            limit_req zone=api_per_ip burst=40 nodelay;
            limit_conn connections_per_ip 8;

            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_buffering          off;
            proxy_request_buffering  off;
        }

        # -------- Static (optional) --------
        location / {
            root   /usr/share/nginx/html;
            index  route.html;
        }
    }
}
