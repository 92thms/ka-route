services:
  kleinanzeigen-route-scraper:
    image: ghcr.io/92thms/kleinanzeigen-route-scraper:latest
    container_name: kleinanzeigen-route-scraper
    ports:
      - "8401:80"
    restart: unless-stopped
    environment:
      ORS_API_KEY: ${ORS_API_KEY}
      MAINTENANCE_MODE: ${MAINTENANCE_MODE:-0}
      MAINTENANCE_KEY: ${MAINTENANCE_KEY:-}
      STATS_HASH_SALT: ${STATS_HASH_SALT:-}
      SCRAPER_RATE_LIMIT_SECONDS: ${SCRAPER_RATE_LIMIT_SECONDS:-1.0}
      NOMINATIM_RATE_LIMIT_SECONDS: ${NOMINATIM_RATE_LIMIT_SECONDS:-1.1}
      PROXY_ALLOW_HOSTS: ${PROXY_ALLOW_HOSTS:-nominatim.openstreetmap.org,www.kleinanzeigen.de}
    volumes:
      - ./data:/data
